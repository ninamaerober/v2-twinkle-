<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Supabase Social Feed</title>
  <style>
    body { background: #f8f9fa; font-family: Arial, sans-serif; }
    .top-bar, .nav-links, .post-container, .bottom-nav { background: white; }
    .top-bar img, .bottom-nav img { width: 30px; height: 30px; }
    .post-container { margin: 10px; border-radius: 10px; border: 1px solid #ccc; }
    .post-header, .post-content, .post-footer, .comment-section, .comments { padding: 10px; }
    .post-header { display: flex; align-items: center; gap: 10px; }
    .post-header img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    .post-header-info { flex: 1; }
    .post-content img { max-width: 100%; border-radius: 8px; margin-top: 10px; }
    .post-footer { display: flex; justify-content: space-around; border-top: 1px solid #eee; padding-top: 10px; }
    .post-footer .action { display: flex; align-items: center; gap: 5px; cursor: pointer; }
    .comment-section textarea { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #ccc; resize: vertical; }
    .comment-section button { background: #3897f0; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
    .comment { display: flex; align-items: center; margin-top: 10px; gap: 10px; }
    .comment img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
    .liked { color: #ed4956; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="top-bar">
    <img src="twinkle.png" alt="Twinkle Logo" />
  </div>
  <div class="nav-links">
    <a href="#" class="active">For You</a>
    <a href="#">Following</a>
  </div>

  <div id="posts"></div>

  <div class="bottom-nav">
    <a href="homepage.html"><img src="home.png" alt="Home"/></a>
    <a href="friend.html"><img src="light-search.jpg" alt="Search"/></a>
    <a href="post.html"><img src="light-add.jpg" alt="Add"/></a>
    <a href="likes.html"><img src="light-heart.jpg" alt="Likes"/></a>
    <a href="profile.html"><img src="light-profile.jpg" alt="Profile"/></a>
  </div>

  <script>
    const SUPABASE_URL = "https://umsgszmaubthunqwbnjn.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVtc2dzem1hdWJ0aHVucXdibmpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDg3NTgzNTQsImV4cCI6MjA2NDMzNDM1NH0.nD44sDzSrbfkMQ8P4maXq3g4ironGihaU2p0aBomT5I";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    let currentUserId = null;

    document.addEventListener('DOMContentLoaded', async () => {
      // Check if user is logged in
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      currentUserId = user.id;
      
      fetchPosts();
      
      // Set up real-time updates for posts
      const postsChannel = supabase.channel('posts_changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, () => {
          fetchPosts();
        })
        .subscribe();
      
      // Set up real-time updates for comments
      const commentsChannel = supabase.channel('comments_changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'comments' }, () => {
          fetchPosts();
        })
        .subscribe();
      
      // Set up real-time updates for likes
      const likesChannel = supabase.channel('likes_changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'likes' }, () => {
          fetchPosts();
        })
        .subscribe();
    });

    async function fetchPosts() {
      const { data: posts, error } = await supabase
        .from('posts')
        .select(`
          *,
          users (username, profile_image),
          comments:comments(count),
          likes:likes(count),
          user_liked:likes(filter: {user_id: {eq: $currentUserId}})
        `)
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Failed to fetch posts:', error);
        return;
      }

      const postContainer = document.getElementById('posts');
      postContainer.innerHTML = '';

      for (let post of posts) {
        const commentCount = post.comments[0]?.count || 0;
        const likeCount = post.likes[0]?.count || 0;
        const isLiked = post.user_liked.length > 0;

        const postEl = document.createElement('div');
        postEl.className = 'post-container';
        postEl.innerHTML = `
          <div class="post-header">
            <img src="${post.users.profile_image || 'default-profile.jpg'}" alt="User">
            <div class="post-header-info">
              <strong>${post.users.username}</strong><br>
              <small>${new Date(post.created_at).toLocaleString()}</small>
            </div>
          </div>
          <div class="post-content">
            <p>${post.content}</p>
            ${post.post_image ? `<img src="${post.post_image}" alt="Post Image">` : ''}
          </div>
          <div class="post-footer">
            <div class="action ${isLiked ? 'liked' : ''}" onclick="toggleLike('${post.id}', ${isLiked})">
              <img src="${isLiked ? 'red-heart.png' : 'light-heart.jpg'}" alt="Like">
              <span>${likeCount}</span>
            </div>
            <div class="action" onclick="document.getElementById('comments-${post.id}').scrollIntoView()">
              <img src="comment.png" alt="Comment">
              <span>${commentCount}</span>
            </div>
            <div class="action">
              <img src="share.png" alt="Share">
              <span>0</span>
            </div>
          </div>
          <div class="comment-section">
            <form onsubmit="postComment(event, '${post.id}')">
              <textarea name="comment" placeholder="Add a comment..." required></textarea>
              <button type="submit">Comment</button>
            </form>
            <div class="comments" id="comments-${post.id}"></div>
          </div>
        `;
        postContainer.appendChild(postEl);

        loadComments(post.id);
      }
    }

    async function loadComments(postId) {
      const { data: comments, error } = await supabase
        .from('comments')
        .select('*, users(username, profile_image)')
        .eq('post_id', postId)
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Error loading comments:', error);
        return;
      }

      const container = document.getElementById(`comments-${postId}`);
      container.innerHTML = '';

      if (comments.length === 0) {
        container.innerHTML = '<p>No comments yet</p>';
        return;
      }

      for (let comment of comments) {
        const commentEl = document.createElement('div');
        commentEl.className = 'comment';
        commentEl.innerHTML = `
          <img src="${comment.users.profile_image || 'default-profile.jpg'}" alt="User">
          <div>
            <strong>${comment.users.username}</strong>
            <p>${comment.comment}</p>
            <small>${new Date(comment.created_at).toLocaleTimeString()}</small>
          </div>
        `;
        container.appendChild(commentEl);
      }
    }

    async function postComment(e, postId) {
      e.preventDefault();
      const form = e.target;
      const textarea = form.querySelector('textarea');
      const commentText = textarea.value.trim();
      
      if (!commentText || !currentUserId) return;

      const { error } = await supabase
        .from('comments')
        .insert([{ 
          post_id: postId, 
          user_id: currentUserId, 
          comment: commentText 
        }]);

      if (!error) {
        textarea.value = '';
        loadComments(postId);
        fetchPosts(); // Refresh comment count
      } else {
        console.error('Error posting comment:', error);
      }
    }

    async function toggleLike(postId, isLiked) {
      if (!currentUserId) return;

      if (isLiked) {
        // Unlike the post
        const { error } = await supabase
          .from('likes')
          .delete()
          .eq('post_id', postId)
          .eq('user_id', currentUserId);
          
        if (error) console.error('Error unliking post:', error);
      } else {
        // Like the post
        const { error } = await supabase
          .from('likes')
          .insert([{ 
            post_id: postId, 
            user_id: currentUserId 
          }]);
          
        if (error) console.error('Error liking post:', error);
      }
      
      // Refresh the posts to update like counts
      fetchPosts();
    }

    // Make functions available globally
    window.postComment = postComment;
    window.toggleLike = toggleLike;
  </script>
</body>
</html>
